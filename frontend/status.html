<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pipeline Status - View genomic analysis pipeline status">
    <title>Pipeline Status | LIMS Genomics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F9EC;</text></svg>">
</head>
<body>
    <!-- Navigation (rendered by Nav.init()) -->
    <nav class="nav"></nav>

    <!-- Main Content -->
    <main class="main">
        <div class="view active">
            <div class="view-header">
                <h1 class="view-title">Pipeline Status</h1>
                <p class="view-subtitle">Search for a sample to view its analysis pipeline status and history</p>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <form class="search-form" id="search-form">
                    <div class="form-group">
                        <label class="form-label" for="sample-id-input">Sample ID</label>
                        <input
                            type="text"
                            class="form-input"
                            id="sample-id-input"
                            placeholder="Enter sample ID (e.g., SAMPLE-001)"
                            autocomplete="off"
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        Search
                    </button>
                </form>
            </div>

            <!-- Status Results -->
            <div id="status-results">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <p class="empty-state-title">Search for a sample</p>
                    <p class="empty-state-text">Enter a sample ID above to view its pipeline status</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="shared/ui.js"></script>
    <script src="shared/auth.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/nav.js"></script>
    <script src="status.js"></script>
</body>
</html>
