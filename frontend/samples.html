<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LIMS Samples - View and manage genomic samples">
    <title>LIMS Samples | LIMS Genomics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F9EC;</text></svg>">
</head>
<body>
    <!-- Navigation (rendered by Nav.init()) -->
    <nav class="nav"></nav>

    <!-- Main Content -->
    <main class="main">
        <div class="view active">
            <div class="view-header">
                <h1 class="view-title">LIMS Samples</h1>
                <p class="view-subtitle">Registered samples from LIMS. Click "Run Pipeline" to start genomic analysis.</p>
            </div>

            <div id="samples-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading samples...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Run Pipeline Modal -->
    <div class="modal-backdrop" id="run-pipeline-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Start Pipeline</h2>
                <button class="modal-close" type="button" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 16px;">
                    Start genomic analysis pipeline for sample:
                </p>
                <p style="margin-bottom: 16px;">
                    <strong id="modal-sample-id" style="font-family: var(--font-mono); font-size: 1.125rem;"></strong>
                </p>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">
                    This will launch GATK and VEP workflows on AWS HealthOmics. Standard compute costs apply.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirm-run-btn">Start Pipeline</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="shared/ui.js"></script>
    <script src="shared/auth.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/nav.js"></script>
    <script src="samples.js"></script>
</body>
</html>
