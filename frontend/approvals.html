<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pending Approvals - Review and approve genomic analysis results">
    <title>Pending Approvals | LIMS Genomics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F9EC;</text></svg>">
</head>
<body>
    <!-- Navigation (rendered by Nav.init()) -->
    <nav class="nav"></nav>

    <!-- Main Content -->
    <main class="main">
        <div class="view active">
            <div class="view-header">
                <h1 class="view-title">Pending Approvals</h1>
                <p class="view-subtitle">Review and approve samples awaiting authorization</p>
            </div>

            <div id="approvals-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading pending approvals...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Approval Modal -->
    <div class="modal-backdrop" id="approval-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Approve Sample</h2>
                <button class="modal-close" type="button" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="approval-form">
                <div class="modal-body">
                    <p style="margin-bottom: 16px; color: var(--text-secondary);">
                        Sample ID: <strong id="modal-sample-id" style="color: var(--text-primary); font-family: var(--font-mono);"></strong>
                    </p>
                    <div class="form-group">
                        <label class="form-label" for="approval-reason">Reason (Optional)</label>
                        <textarea
                            class="form-textarea"
                            id="approval-reason"
                            placeholder="Enter reason for approval or rejection..."
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success" id="approval-submit-btn">Approve</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="shared/ui.js"></script>
    <script src="shared/auth.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/nav.js"></script>
    <script src="approvals.js"></script>
</body>
</html>
