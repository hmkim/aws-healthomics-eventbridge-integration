<html lang="en">
<head>

    <meta name="description" content="LIMS Genomics Dashboard - Pipeline Status and Approvals Management">
    <title>LIMS Genomics Dashboard</title>
    <link rel="stylesheet" href="styles.css">

            Auth.init();
